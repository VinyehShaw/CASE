# Combined tool config for mixed medpanel_v2 + vista3d multi-turn tool RL.
# 6 tools: 3 medpanel_v2 (list_available_images, view_image, compare_visits)
#        + 3 vista3d (vista3d_segment, vista3d_compare_stations, vista3d_compare_visits)

tools:
  # ── MedPanel v2 tools ──────────────────────────────────────────────────
  - class_name: "distill.tool.radiologist.radiologist_mock_tool.MedPanelV2MockTool"
    config:
      type: native
      cache_path: "/mnt/faster_nas/benyou.mys/medixrl/data/medpanel_v2_tool_cache/tool_cache.json"
      include_images: true
    tool_schema:
      type: function
      function:
        name: list_available_images
        description: >-
          List all available imaging modalities for this patient.
          Returns modality names, shapes, and descriptions.
        parameters:
          type: object
          properties: {}
          required: []

  - class_name: "distill.tool.radiologist.radiologist_mock_tool.MedPanelV2MockTool"
    config:
      type: native
      cache_path: "/mnt/faster_nas/benyou.mys/medixrl/data/medpanel_v2_tool_cache/tool_cache.json"
      include_images: true
    tool_schema:
      type: function
      function:
        name: view_image
        description: >-
          View a specific axial slice from a modality at a given visit.
          Returns the image and metadata.
        parameters:
          type: object
          properties:
            modality:
              type: string
              description: "Modality name (e.g. 'brain_t1', 'heart_short_axis', 'liver_ideal', 'dixon_8_W')"
            visit:
              type: string
              description: "'v1' for baseline or 'v2' for follow-up"
            slice_idx:
              type: integer
              description: "Slice index (use -1 for middle slice)"
          required: [modality, visit]

  - class_name: "distill.tool.radiologist.radiologist_mock_tool.MedPanelV2MockTool"
    config:
      type: native
      cache_path: "/mnt/faster_nas/benyou.mys/medixrl/data/medpanel_v2_tool_cache/tool_cache.json"
      include_images: true
    tool_schema:
      type: function
      function:
        name: compare_visits
        description: >-
          Compare the same slice between Visit 1 and Visit 2 side-by-side.
          Returns a side-by-side comparison image.
        parameters:
          type: object
          properties:
            modality:
              type: string
              description: "Modality name (e.g. 'brain_t1', 'liver_ideal', 'dixon_8_W')"
            slice_idx:
              type: integer
              description: "Slice index (use -1 for middle slice)"
          required: [modality]

  # ── Vista3D tools ──────────────────────────────────────────────────────
  - class_name: "distill.tool.anatomist.anatomist_mock_tool.Vista3DMockTool"
    config:
      type: native
      cache_path: "/mnt/faster_nas/benyou.mys/medixrl/data/vista3d_tool_cache/tool_cache.json"
      include_images: true
    tool_schema:
      type: function
      function:
        name: vista3d_segment
        description: >-
          Get Vista3D segmentation volume for a specific organ, broken down per body station.
          Returns per-station volumes, slice ranges, and total volume. Use this first
          to understand the organ's spatial distribution across body stations.
        parameters:
          type: object
          properties:
            organ:
              type: string
              description: Organ name (e.g., "liver", "spleen", "pancreas", "kidney_left", "heart")
          required: [organ]

  - class_name: "distill.tool.anatomist.anatomist_mock_tool.Vista3DMockTool"
    config:
      type: native
      cache_path: "/mnt/faster_nas/benyou.mys/medixrl/data/vista3d_tool_cache/tool_cache.json"
      include_images: true
    tool_schema:
      type: function
      function:
        name: vista3d_compare_stations
        description: >-
          Compare an organ's volume and morphology between dixon_8_W (thorax) and dixon_12_W (abdomen).
          Returns per-station volumes, slice overlap info, volume difference, and
          overlay images showing the organ highlighted on its largest slice in each station.
          Use this for organs that may span both stations (liver, pancreas, kidneys, spleen).
        parameters:
          type: object
          properties:
            organ:
              type: string
              description: Organ name (e.g., "liver", "pancreas", "kidney_left")
          required: [organ]

  - class_name: "distill.tool.anatomist.anatomist_mock_tool.Vista3DMockTool"
    config:
      type: native
      cache_path: "/mnt/faster_nas/benyou.mys/medixrl/data/vista3d_tool_cache/tool_cache.json"
      include_images: true
    tool_schema:
      type: function
      function:
        name: vista3d_compare_visits
        description: >-
          Compare an organ's volume between V1 (baseline) and V2 (follow-up) MRI visits.
          Returns V1 volume, V2 volume, volume change, per-station breakdown, and
          overlay images from both visits for visual comparison.
          This is the PRIMARY tool for analyzing organ volume changes over time.
        parameters:
          type: object
          properties:
            organ:
              type: string
              description: Organ name (e.g., "liver", "pancreas", "kidney_left", "spleen")
          required: [organ]
